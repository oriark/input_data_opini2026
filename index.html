<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan ke Sistem...</title>

    <!-- Redirect otomatis -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbyNxbpQ2mElGczgcZhUk5rEu9rX7C87-9Dg4RFEcT_SSOIATgp_iTJ8XGrZVtSWjrIu/exec">

    <script>
        window.location.replace("https://script.google.com/macros/s/AKfycbyNxbpQ2mElGczgcZhUk5rEu9rX7C87-9Dg4RFEcT_SSOIATgp_iTJ8XGrZVtSWjrIu/exec");
    </script>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f7fb;
            color:#0F4C81;
        }

        .box{
            text-align:center;
        }

        .loader{
            width:45px;
            height:45px;
            border:5px solid #ddd;
            border-top:5px solid #0F4C81;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin:0 auto 20px;
        }

        @keyframes spin{
            from{transform:rotate(0deg);}
            to{transform:rotate(360deg);}
        }

        a{
            color:#0F4C81;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="loader"></div>

    <h2>Mengarahkan ke Sistem...</h2>

    <p>Jika tidak dialihkan secara otomatis, silakan klik tautan berikut.</p>

    <p>
        <a href="https://script.google.com/macros/s/AKfycbyNxbpQ2mElGczgcZhUk5rEu9rX7C87-9Dg4RFEcT_SSOIATgp_iTJ8XGrZVtSWjrIu/exec">
            Buka Sistem
        </a>
    </p>

</div>

</body>
</html>
